  <script>
    (function () {
      const filters = document.querySelectorAll('.roster-filter');
      const cards = document.querySelectorAll('.roster-card');
      filters.forEach((btn) => {
        btn.addEventListener('click', () => {
          const role = btn.getAttribute('data-role');
          filters.forEach((f) => {
            const active = f === btn;
            f.setAttribute('aria-pressed', active ? 'true' : 'false');
            if (active) {
              f.className = 'roster-filter rounded-full bg-light-primary text-light-on-primary px-gutter-md py-gutter-xs font-label text-label-sm transition-colors duration-state-change ease-state-change';
            } else {
              f.className = 'roster-filter rounded-full bg-light-surface-container-low text-light-on-surface-variant border border-light-outline-variant px-gutter-md py-gutter-xs font-label text-label-sm transition-colors duration-state-change ease-state-change hover:bg-light-surface-container';
            }
          });
          cards.forEach((card) => {
            const type = card.getAttribute('data-role-type');
            card.classList.toggle('hidden', role !== 'all' && type !== role);
          });
        });
      });
    })();
  </script>
