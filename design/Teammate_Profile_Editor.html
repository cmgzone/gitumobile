      <section aria-label="Permissions" class="flex flex-col gap-gutter-sm">
        <h2 class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Permissions</h2>
        <div class="grid grid-cols-2 gap-gutter-sm items-stretch">
          <label class="h-full rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-md flex items-start justify-between gap-gutter-sm cursor-pointer hover:bg-light-surface-container-low">
            <div class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-sm text-light-on-surface" data-design-text-token="label-sm">Shell</span>
              <span class="font-body text-body-sm text-light-on-surface-variant" data-design-text-token="body-sm">Run CLI</span>
            </div>
            <input type="checkbox" checked aria-label="Allow shell execution" class="h-5 w-5 rounded text-light-primary border-light-outline-variant focus:ring-light-primary shrink-0">
          </label>

          <label class="h-full rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-md flex items-start justify-between gap-gutter-sm cursor-pointer hover:bg-light-surface-container-low">
            <div class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-sm text-light-on-surface" data-design-text-token="label-sm">Write files</span>
              <span class="font-body text-body-sm text-light-on-surface-variant" data-design-text-token="body-sm">Edit code</span>
            </div>
            <input type="checkbox" checked aria-label="Allow writing workspace files" class="h-5 w-5 rounded text-light-primary border-light-outline-variant focus:ring-light-primary shrink-0">
          </label>

          <label class="h-full rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-md flex items-start justify-between gap-gutter-sm cursor-pointer hover:bg-light-surface-container-low">
            <div class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-sm text-light-on-surface" data-design-text-token="label-sm">Tool setup</span>
              <span class="font-body text-body-sm text-light-on-surface-variant" data-design-text-token="body-sm">Install deps</span>
            </div>
            <input type="checkbox" aria-label="Allow tool setup" class="h-5 w-5 rounded text-light-primary border-light-outline-variant focus:ring-light-primary shrink-0">
          </label>

          <label class="h-full rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-md flex items-start justify-between gap-gutter-sm cursor-pointer hover:bg-light-surface-container-low">
            <div class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-sm text-light-on-surface" data-design-text-token="label-sm">Proactive</span>
              <span class="font-body text-body-sm text-light-on-surface-variant" data-design-text-token="body-sm">Auto alerts</span>
            </div>
            <input type="checkbox" aria-label="Enable proactive check-ins" class="h-5 w-5 rounded text-light-primary border-light-outline-variant focus:ring-light-primary shrink-0">
          </label>
        </div>
      </section>

      <!-- Destructive Action Isolated at Bottom -->
      <section aria-label="Danger zone" class="pt-gutter-xs pb-gutter-xl">
        <button type="button" class="w-full rounded-full border border-light-error text-light-error py-gutter-sm font-label text-label-lg transition-colors duration-state-change ease-state-change hover:bg-light-error-container hover:text-light-on-error-container" data-design-text-token="label-lg">
          Delete teammate
        </button>
      </section>

    </main>

  </div>

  <script>
    (function () {
      const presets = document.querySelectorAll('.preset-chip');
      presets.forEach((chip) => {
        chip.addEventListener('click', () => {
          presets.forEach((c) => {
            const active = c === chip;
            c.setAttribute('aria-pressed', active ? 'true' : 'false');
            c.className = active
              ? 'preset-chip rounded-md bg-light-primary text-light-on-primary px-gutter-md py-gutter-sm font-label text-label-sm text-center'
              : 'preset-chip rounded-md bg-light-surface-container-lowest text-light-on-surface-variant border border-light-outline-variant px-gutter-md py-gutter-sm font-label text-label-sm text-center';
          });
        });
      });

      const efforts = document.querySelectorAll('.effort-btn');
      efforts.forEach((btn) => {
        btn.addEventListener('click', () => {
          efforts.forEach((b) => {
            const active = b === btn;
            b.setAttribute('aria-pressed', active ? 'true' : 'false');
            b.className = active
              ? 'effort-btn rounded-full py-gutter-xs font-label text-label-sm bg-light-surface-container-lowest text-light-on-surface'
              : 'effort-btn rounded-full py-gutter-xs font-label text-label-sm text-light-on-surface-variant';
          });
        });
      });

      const tiles = document.querySelectorAll('.compute-tile');
      tiles.forEach((tile) => {
        tile.addEventListener('click', () => {
          tiles.forEach((t) => {
            const active = t === tile;
            t.setAttribute('aria-pressed', active ? 'true' : 'false');
            t.className = active
              ? 'compute-tile h-full rounded-lg bg-light-surface-container-low border-2 border-light-primary p-gutter-md flex flex-col items-center text-center gap-gutter-xs transition-colors duration-state-change ease-state-change'
              : 'compute-tile h-full rounded-lg bg-light-surface-container-lowest border border-light-outline-variant p-gutter-md flex flex-col items-center text-center gap-gutter-xs transition-colors duration-state-change ease-state-change hover:bg-light-surface-container-low';
          });
        });
      });

      const skillSearch = document.getElementById('skill-search');
      const skillTiles = document.querySelectorAll('.skill-tile');
      if (skillSearch) {
        skillSearch.addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase();
          skillTiles.forEach((tile) => {
            const name = (tile.getAttribute('data-skill') || '').toLowerCase();
            tile.classList.toggle('hidden', q !== '' && !name.includes(q));
          });
        });
      }
      skillTiles.forEach((tile) => {
        tile.addEventListener('click', () => {
          const active = tile.getAttribute('aria-pressed') !== 'true';
          tile.setAttribute('aria-pressed', active ? 'true' : 'false');
          tile.className = active
            ? 'skill-tile rounded-md bg-light-secondary-container text-light-on-secondary-container border border-light-primary px-gutter-md py-gutter-sm flex items-center justify-between gap-gutter-xs text-left'
            : 'skill-tile rounded-md bg-light-surface-container-low text-light-on-surface-variant border border-light-outline-variant px-gutter-md py-gutter-sm flex items-center justify-between gap-gutter-xs text-left';
          const icon = tile.querySelector('.material-symbols-outlined');
          if (icon) icon.textContent = active ? 'check_circle' : 'add_circle_outline';
        });
      });
    })();
  </script>


</body></html>
